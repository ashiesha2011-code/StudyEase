<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mindfulness — StudyEase</title>
  <link rel="icon" href="images/studyease-fav.png" type="image/png"/>
  <link rel="apple-touch-icon" href="images/studyease-fav.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <style>
/* ── Loading splash ── */
#yoga-splash{position:fixed;inset:0;background:#fff;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .4s ease}
#yoga-splash .s-img{width:90px;height:90px;object-fit:contain;animation:yogaPulse 1.6s ease-in-out infinite}
#yoga-splash .s-txt{font-family:'DM Sans',sans-serif;font-size:1.05rem;font-weight:600;color:#0A1628;opacity:.65;letter-spacing:.03em}
@keyframes yogaPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ── Reset ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:linear-gradient(145deg,#D1FAE5 0%,#EDE9FE 50%,#DBEAFE 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;color:#1E293B}

/* ── Topbar ── */
.topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:20;background:rgba(255,255,255,.55);backdrop-filter:blur(14px);border-bottom:1px solid rgba(20,184,166,.12)}
.back-link{display:flex;align-items:center;gap:6px;font-size:.84rem;font-weight:600;color:#64748B;text-decoration:none;transition:color .15s}
.back-link:hover{color:#0A1628}
.session-badge{background:rgba(255,255,255,.9);border:1px solid rgba(20,184,166,.3);border-radius:99px;padding:5px 14px;font-size:.77rem;font-weight:600;color:#0F766E;white-space:nowrap}

/* ── Page wrapper ── */
.page{flex:1;display:flex;flex-direction:column;align-items:center;padding:76px 20px 52px;width:100%;max-width:540px}

/* ── Hero header ── */
.hero{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:24px;text-align:center}
.hero-ring{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,rgba(20,184,166,.18),rgba(139,92,246,.14));border:1.5px solid rgba(20,184,166,.25);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 24px rgba(20,184,166,.18),0 0 0 8px rgba(20,184,166,.06)}
.hero-ring img{width:46px;height:46px;object-fit:contain}
.hero h1{font-size:1.65rem;font-weight:700;color:#0A1628;letter-spacing:-.02em}
.hero-sub{font-size:.8rem;font-weight:600;color:#94A3B8;letter-spacing:.1em;text-transform:uppercase}

/* ── Card ── */
.card{background:rgba(255,255,255,.58);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.85);border-radius:26px;padding:28px 26px 26px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04),inset 0 1px 0 rgba(255,255,255,.8)}

/* ── Tabs ── */
.page-tabs{display:flex;gap:0;background:rgba(241,245,249,.75);border:1px solid rgba(148,163,184,.18);border-radius:99px;padding:4px;margin-bottom:24px}
.page-tab{flex:1;padding:9px 20px;border-radius:99px;border:none;background:none;font-family:inherit;font-size:.88rem;font-weight:600;color:#64748B;cursor:pointer;transition:all .2s}
.page-tab.active{background:#14B8A6;color:white;box-shadow:0 2px 12px rgba(20,184,166,.38)}

/* ── Mode buttons ── */
.mode-row{display:flex;gap:7px;margin-bottom:24px;flex-wrap:wrap;justify-content:center}
.mode-btn{padding:7px 16px;border-radius:99px;border:1.5px solid rgba(20,184,166,.25);background:rgba(255,255,255,.6);font-family:inherit;font-size:.82rem;font-weight:600;color:#475569;cursor:pointer;transition:all .18s}
.mode-btn:hover{border-color:#14B8A6;color:#0F766E;background:rgba(20,184,166,.07)}
.mode-btn.active{background:#14B8A6;border-color:#14B8A6;color:white;box-shadow:0 2px 10px rgba(20,184,166,.32)}

/* ── Circle ── */
.circle-wrap{position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:22px}
.circle-outer{width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(99,210,190,.18) 0%,rgba(147,197,253,.07) 60%,transparent 100%);display:flex;align-items:center;justify-content:center;position:relative}
.circle-ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(20,184,166,.18)}
.circle-main{width:164px;height:164px;border-radius:50%;background:linear-gradient(135deg,rgba(20,184,166,.72) 0%,rgba(59,130,246,.65) 100%);box-shadow:0 0 50px rgba(20,184,166,.3),0 0 100px rgba(147,197,253,.12),inset 0 1px 0 rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;transition:transform .1s linear}
.breath-label{font-size:1rem;font-weight:700;color:white;letter-spacing:.01em;text-align:center;line-height:1.3;text-shadow:0 1px 4px rgba(0,0,0,.18)}
.breath-count{font-size:2.2rem;font-weight:700;color:white;opacity:.92;line-height:1;text-shadow:0 1px 4px rgba(0,0,0,.18)}
.pulse-ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(20,184,166,.18);animation:pulse-out 3s ease-out infinite;pointer-events:none}
.pulse-ring:nth-child(2){animation-delay:1s}
.pulse-ring:nth-child(3){animation-delay:2s}
@keyframes pulse-out{0%{transform:scale(1);opacity:.75}100%{transform:scale(1.55);opacity:0}}

/* ── Meditation circle variant ── */
.circle-main.med-mode{background:linear-gradient(135deg,rgba(139,92,246,.72) 0%,rgba(99,102,241,.65) 100%);box-shadow:0 0 50px rgba(139,92,246,.28),0 0 100px rgba(167,139,250,.1),inset 0 1px 0 rgba(255,255,255,.3);animation:med-pulse 8s ease-in-out infinite}
@keyframes med-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.pulse-ring.med-mode{border-color:rgba(139,92,246,.2)}

/* ── Timer row ── */
.timer-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;justify-content:center}
.timer-display{font-size:1.55rem;font-weight:700;color:#0F766E;letter-spacing:-.02em;min-width:76px;text-align:center}
.timer-display.med{color:#7C3AED}
.timer-sep{color:#94A3B8;font-size:.8rem;font-weight:500}
.duration-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dur-btn{padding:5px 13px;border-radius:99px;border:1.5px solid rgba(20,184,166,.25);background:rgba(255,255,255,.55);font-family:inherit;font-size:.78rem;font-weight:600;color:#475569;cursor:pointer;transition:all .15s}
.dur-btn:hover{border-color:#14B8A6;color:#0F766E}
.dur-btn.active{background:#14B8A6;border-color:#14B8A6;color:white;box-shadow:0 2px 7px rgba(20,184,166,.28)}

/* ── Custom input ── */
.custom-wrap{display:none;align-items:center;gap:6px;margin-top:8px}
.custom-wrap.show{display:flex}
.custom-inp{width:64px;padding:5px 10px;border:1.5px solid rgba(20,184,166,.4);border-radius:8px;font-family:inherit;font-size:.85rem;font-weight:600;color:#0F766E;text-align:center;outline:none;background:rgba(255,255,255,.8)}
.custom-inp:focus{border-color:#14B8A6}
.custom-set{padding:5px 14px;border-radius:99px;background:#14B8A6;border:none;color:white;font-family:inherit;font-size:.78rem;font-weight:600;cursor:pointer}
.custom-lbl{font-size:.78rem;color:#64748B;font-weight:500}

/* ── Start button ── */
.start-wrap{display:flex;flex-direction:column;align-items:center;gap:7px;margin-top:4px}
.start-btn{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#14B8A6,#3B82F6);border:none;cursor:pointer;color:white;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 24px rgba(20,184,166,.42),0 0 0 7px rgba(20,184,166,.1);transition:transform .15s,box-shadow .15s}
.start-btn:hover{transform:scale(1.07);box-shadow:0 6px 32px rgba(20,184,166,.52),0 0 0 9px rgba(20,184,166,.13)}
.start-btn:active{transform:scale(.96)}
.start-btn.med-mode{background:linear-gradient(135deg,#8B5CF6,#6366F1);box-shadow:0 4px 24px rgba(139,92,246,.42),0 0 0 7px rgba(139,92,246,.1)}
.start-btn.med-mode:hover{box-shadow:0 6px 32px rgba(139,92,246,.52),0 0 0 9px rgba(139,92,246,.13)}
.start-hint{font-size:.74rem;color:#94A3B8;font-weight:500;letter-spacing:.02em}

/* ── Music toggle ── */
.music-row{display:flex;align-items:center;gap:9px;margin-top:18px}
.music-toggle{display:flex;align-items:center;gap:7px;padding:8px 18px;border-radius:99px;border:1.5px solid rgba(139,92,246,.28);background:rgba(255,255,255,.55);font-family:inherit;font-size:.82rem;font-weight:600;color:#7C3AED;cursor:pointer;transition:all .18s}
.music-toggle:hover{border-color:#8B5CF6;background:rgba(139,92,246,.07)}
.music-toggle.on{background:linear-gradient(135deg,#8B5CF6,#6366F1);border-color:transparent;color:white;box-shadow:0 3px 14px rgba(139,92,246,.35)}
.music-dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:mdot 1s infinite;display:none}
.music-toggle.on .music-dot{display:block}
@keyframes mdot{0%,100%{opacity:1}50%{opacity:.3}}

/* ── Prompt & misc ── */
.prompt-text{font-size:1rem;font-weight:500;color:#475569;text-align:center;min-height:1.5em;transition:opacity .6s;max-width:300px;line-height:1.65;margin:6px 0 8px}
.cycle-row{margin-top:9px;font-size:.78rem;color:#94A3B8;font-weight:500;text-align:center}
.mode-desc{text-align:center;font-size:.81rem;color:#64748B;line-height:1.65;max-width:300px;margin-top:10px}

/* ── Section visibility ── */
.breath-section{display:flex;flex-direction:column;align-items:center;width:100%}
.med-section{display:none;flex-direction:column;align-items:center;width:100%}

@media(max-width:480px){
  .circle-outer{width:188px;height:188px}.circle-main{width:138px;height:138px}
  .breath-count{font-size:1.8rem}.timer-display{font-size:1.3rem}
  .card{padding:22px 16px 20px;border-radius:20px}
  .hero h1{font-size:1.4rem}.hero-ring{width:68px;height:68px}.hero-ring img{width:38px;height:38px}
}
  </style>
</head>
<body>

<!-- Loading splash -->
<div id="yoga-splash">

</div>

<!-- Topbar -->
<div class="topbar">

        <button class="mode-btn" data-mode="478" onclick="setBreathMode('478',this)">4-7-8</button>
        <button class="mode-btn" data-mode="simple" onclick="setBreathMode('simple',this)">Simple Deep Breath</button>
      </div>

      <div class="circle-wrap">
        <div class="circle-outer">
          <div class="pulse-ring"></div>
          <div class="pulse-ring"></div>
          <div class="pulse-ring"></div>
          <div class="circle-ring"></div>
          <div class="circle-main" id="b-circle">
            <div class="breath-label" id="b-label">Ready</div>
            <div class="breath-count" id="b-count">–</div>

      <div class="timer-row">

          </div>
          <div class="custom-wrap" id="b-custom-wrap">
            <input class="custom-inp" id="b-custom-inp" type="number" min="1" max="60" placeholder="5"/>

          </div>
        </div>
      </div>

      <div class="start-wrap">
        <button class="start-btn" id="b-start" onclick="toggleBreath()">
          <svg id="b-icon" width="26" height="26" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/></svg>

    </div>

    <!-- ── MEDITATION SECTION ── -->
    <div class="med-section" id="med-section">

      <div class="circle-wrap">
        <div class="circle-outer">
          <div class="pulse-ring med-mode"></div>
          <div class="pulse-ring med-mode"></div>
          <div class="pulse-ring med-mode"></div>
          <div class="circle-ring"></div>
          <div class="circle-main med-mode" id="m-circle">
            <div class="breath-label" id="m-label">Ready</div>
            <div class="breath-count" id="m-count">–</div>
          </div>
        </div>
      </div>

      <div class="prompt-text" id="m-prompt">Find a comfortable position and close your eyes.</div>

      <div class="timer-row">
        <div class="timer-display med" id="m-timer">0:00</div>
        <span class="timer-sep">of</span>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
          <div class="duration-btns">
            <button class="dur-btn active" onclick="setDur('m',300,this)">5 min</button>
            <button class="dur-btn" onclick="setDur('m',600,this)">10 min</button>
            <button class="dur-btn" onclick="setDur('m',900,this)">15 min</button>
            <button class="dur-btn" id="m-custom-btn" onclick="toggleCustom('m')">Custom</button>
          </div>
          <div class="custom-wrap" id="m-custom-wrap">
            <input class="custom-inp" id="m-custom-inp" type="number" min="1" max="60" placeholder="10"/>
            <span class="custom-lbl">min</span>
            <button class="custom-set" onclick="applyCustom('m')">Set</button>
          </div>
        </div>
      </div>

      <div class="start-wrap">
        <button class="start-btn med-mode" id="m-start" onclick="toggleMed()">
          <svg id="m-icon" width="26" height="26" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/></svg>
        </button>
        <span class="start-hint">Tap to begin</span>
      </div>

      <div class="music-row">
        <button class="music-toggle" id="music-toggle" onclick="toggleMusic()">
          <div class="music-dot"></div>
          🎵 Ambient music
        </button>
      </div>

      <div class="cycle-row" id="m-cycle"></div>
    </div>

  </div><!-- /card -->
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ── Loading splash ── */
(function(){
  var splash=document.getElementById('yoga-splash');
  setTimeout(function(){
    splash.style.opacity='0';
    setTimeout(function(){splash.style.display='none';},420);
  },2000);
})();

(function(){

/* ── Supabase (optional) ── */
var _sb=null,_uid=null;
try{
  var _SURL='https://xiwrvbtryeesfgeydxnf.supabase.co';
  var _SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhpd3J2YnRyeWVlc2ZnZXlkeG5mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTQ0NDAsImV4cCI6MjA5NDU5MDQ0MH0.3Sp9dlc8cNsrzdHAGy74pCqscjL1MFV9ZWMW90QbhqE';
  _sb=window.supabase?window.supabase.createClient(_SURL,_SKEY):null;
  if(_sb)_sb.auth.getUser().then(function(r){
    if(r.data&&r.data.user){
      _uid=r.data.user.id;
      var bb=document.getElementById('back-btn');
      if(bb)bb.href='dashboard.html';
    }
  });
}catch(e){}

function saveSessionToDB(type,mode,duration){
  if(!_sb||!_uid)return;
  _sb.from('mood_checkins')
    .insert({user_id:_uid,type:type,mode:mode,duration:duration,date:new Date().toDateString()})
    .then(function(r){if(r.error)console.error('Mindfulness save error:',r.error);});
}

/* ── LocalStorage ── */
var TODAY=new Date().toDateString();
var stored=JSON.parse(localStorage.getItem('se_breath')||'{}');
if(stored.date!==TODAY)stored={date:TODAY,sessions:0};
function updateBadge(){var s=stored.sessions||0;document.getElementById('session-badge').textContent=s===0?'0 sessions today':s+' session'+(s!==1?'s':'')+' today';}
updateBadge();

/* ── Tab switch ── */
window.switchTab=function(tab,btn){
  document.querySelectorAll('.page-tab').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById('breath-section').style.display=tab==='breath'?'flex':'none';
  document.getElementById('med-section').style.display=tab==='med'?'flex':'none';
};

/* ── Custom timer ── */
window.toggleCustom=function(pfx){
  var w=document.getElementById(pfx+'-custom-wrap');
  var showing=w.classList.toggle('show');
  document.getElementById(pfx+'-custom-btn').classList.toggle('active',showing);
};
window.applyCustom=function(pfx){
  var v=parseInt(document.getElementById(pfx+'-custom-inp').value)||0;
  if(v<1||v>60)return;
  var secs=v*60;
  if(pfx==='b'){bTarget=secs;}else{mTarget=secs;}
  document.querySelectorAll(pfx==='b'?'.breath-section .dur-btn':'.med-section .dur-btn').forEach(function(b){b.classList.remove('active');});
  document.getElementById(pfx+'-custom-btn').classList.add('active');
  document.getElementById(pfx+'-custom-wrap').classList.remove('show');
};
window.setDur=function(pfx,secs,btn){
  if(pfx==='b')bTarget=secs;else mTarget=secs;
  document.querySelectorAll(pfx==='b'?'.breath-section .dur-btn':'.med-section .dur-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById(pfx+'-custom-wrap').classList.remove('show');
};

/* ══ AUDIO ENGINE ══ */
var audioCtx=null;
function getCtx(){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  return audioCtx;
}
function playTone(freq,dur,vol,type){
  try{var ctx=getCtx(),o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type=type||'sine';o.frequency.setValueAtTime(freq,ctx.currentTime);g.gain.setValueAtTime(0,ctx.currentTime);g.gain.linearRampToValueAtTime(vol,ctx.currentTime+0.02);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);o.start(ctx.currentTime);o.stop(ctx.currentTime+dur);}catch(e){}
}
function chimePhase(phase){
  if(phase==='Breathe in'){playTone(523,.35,.18);setTimeout(function(){playTone(659,.3,.14)},120);}
  else if(phase==='Hold'){playTone(440,.3,.12);}
  else{playTone(494,.35,.16);setTimeout(function(){playTone(392,.4,.12)},140);}
}
var BEEP={3:330,2:392,1:523};
function beepCount(n){if(n>=1&&n<=3)playTone(BEEP[n],.18,.22,'triangle');}

function playBell(vol){
  vol=vol||0.28;
  try{
    var ctx=getCtx();
    [[880,vol,3],[1760,vol*.28,2],[2637,vol*.12,1.5]].forEach(function(p){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);o.type='sine';
      o.frequency.setValueAtTime(p[0],ctx.currentTime);
      g.gain.setValueAtTime(p[1],ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+p[2]);
      o.start(ctx.currentTime);o.stop(ctx.currentTime+p[2]);
    });
  }catch(e){}
}

var droneNodes=[];
var musicOn=false;
function startDrone(){
  if(droneNodes.length)return;
  try{
    var ctx=getCtx();
    var master=ctx.createGain();master.gain.value=0.001;master.connect(ctx.destination);
    master.gain.linearRampToValueAtTime(1,ctx.currentTime+3);
    [[110,112],[165,166.5],[220,221.5],[330,330.8]].forEach(function(pair,i){
      pair.forEach(function(freq){
        var o=ctx.createOscillator(),g=ctx.createGain();
        o.type='sine';o.frequency.value=freq;
        var v=[.055,.04,.03,.018][i];
        g.gain.value=v;
        o.connect(g);g.connect(master);o.start();
        droneNodes.push(o);
      });
    });
    droneNodes.push(master);
  }catch(e){}
}
function stopDrone(){
  if(!droneNodes.length)return;
  try{
    var ctx=getCtx();
    var master=droneNodes[droneNodes.length-1];
    master.gain.setValueAtTime(master.gain.value,ctx.currentTime);
    master.gain.linearRampToValueAtTime(0,ctx.currentTime+2);
    setTimeout(function(){
      droneNodes.forEach(function(n){try{n.stop&&n.stop();}catch(e){}});
      droneNodes=[];
    },2200);
  }catch(e){droneNodes=[];}
}
window.toggleMusic=function(){
  getCtx();
  musicOn=!musicOn;
  var btn=document.getElementById('music-toggle');
  btn.classList.toggle('on',musicOn);
  if(musicOn){startDrone();if(medRunning)playBell(.15);}
  else stopDrone();
};

var bellInt=null;
function startBells(){bellInt=setInterval(function(){if(musicOn)playBell(.18);},30000);}
function stopBells(){clearInterval(bellInt);bellInt=null;}

/* ══ BREATHING ══ */
var MODES={
  box:   {phases:['Breathe in','Hold','Breathe out','Hold'],times:[4,4,4,4],desc:'Inhale 4s · Hold 4s · Exhale 4s · Hold 4s'},
  '478': {phases:['Breathe in','Hold','Breathe out'],times:[4,7,8],desc:'Inhale 4s · Hold 7s · Exhale 8s — calms the nervous system'},
  simple:{phases:['Breathe in','Hold','Breathe out'],times:[4,4,8],desc:'Inhale 4s · Hold 4s · Exhale 8s — slow and steady'},
};
var bMode='box',bTarget=120,bRunning=false,bElapsed=0,bPhaseTime=0,bPhaseIdx=0,bCycles=0,bInt=null;
var MAX_S=1.22,MIN_S=0.82;

window.setBreathMode=function(m,btn){
  if(bRunning)return;
  bMode=m;
  document.querySelectorAll('.breath-section .mode-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById('b-desc').textContent=MODES[m].desc;
  document.getElementById('b-label').textContent='Ready';
  document.getElementById('b-count').textContent='–';
  document.getElementById('b-circle').style.transform='scale(1)';
};

window.toggleBreath=function(){bRunning?stopBreath():startBreath();};

function startBreath(){
  bRunning=true;bElapsed=0;bPhaseTime=0;bPhaseIdx=0;bCycles=0;
  document.getElementById('b-icon').innerHTML='<path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/>';
  renderBreathPhase();
  bInt=setInterval(bTick,1000);
}
function stopBreath(){
  bRunning=false;clearInterval(bInt);
  saved('breathing',bMode);
  document.getElementById('b-icon').innerHTML='<path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/>';
  document.getElementById('b-label').textContent='Done';
  document.getElementById('b-count').textContent='';
  document.getElementById('b-circle').style.transform='scale(1)';
  document.getElementById('b-cycle').textContent=bCycles?'Completed '+bCycles+' cycle'+(bCycles!==1?'s':''):'';
}
function bTick(){
  bElapsed++;bPhaseTime++;
  var m=MODES[bMode],dur=m.times[bPhaseIdx],rem=dur-bPhaseTime;
  document.getElementById('b-count').textContent=rem>0?rem:'';
  document.getElementById('b-timer').textContent=fmtTime(bElapsed);
  animBreath();
  if(rem>=1&&rem<=3)beepCount(rem);
  if(bPhaseTime>=dur){
    bPhaseIdx=(bPhaseIdx+1)%m.phases.length;
    if(bPhaseIdx===0)bCycles++;
    bPhaseTime=0;renderBreathPhase();
  }
  if(bElapsed>=bTarget)stopBreath();
}
function renderBreathPhase(){
  var m=MODES[bMode],label=m.phases[bPhaseIdx],dur=m.times[bPhaseIdx];
  document.getElementById('b-label').textContent=label;
  document.getElementById('b-count').textContent=dur;
  document.getElementById('b-cycle').textContent=bCycles?'Cycle '+bCycles:'';
  animBreath();chimePhase(label);
}
function animBreath(){
  var m=MODES[bMode],phase=m.phases[bPhaseIdx],dur=m.times[bPhaseIdx],pct=bPhaseTime/dur,scale;
  if(phase==='Breathe in')scale=MIN_S+(MAX_S-MIN_S)*pct;
  else if(phase==='Breathe out')scale=MAX_S-(MAX_S-MIN_S)*pct;
  else if(phase==='Hold'&&bPhaseIdx===1)scale=MAX_S;
  else scale=MIN_S;
  document.getElementById('b-circle').style.transform='scale('+scale+')';
}

/* ══ MEDITATION ══ */
var PROMPTS=[
  'Close your eyes and settle in…',
  'Focus on your breath.',
  'Notice each inhale and exhale.',
  'Let your thoughts pass like clouds.',
  'Return gently to the present moment.',
  'Feel the ground beneath you.',
  'You are safe. You are calm.',
  'Release any tension you\'re holding.',
  'There is nowhere else to be right now.',
  'Each breath is a fresh start.',
  'Notice the stillness around you.',
  'You are doing wonderfully.',
];
var mTarget=300,medRunning=false,mElapsed=0,mInt=null,mPromptIdx=0,mPromptInt=null;

window.toggleMed=function(){medRunning?stopMed():startMed();};

function startMed(){
  medRunning=true;mElapsed=0;mPromptIdx=0;
  document.getElementById('m-icon').innerHTML='<path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/>';
  document.getElementById('m-label').textContent='Breathe';
  document.getElementById('m-count').textContent='';
  showPrompt(PROMPTS[0]);
  if(musicOn){startDrone();playBell(.2);}
  startBells();
  mInt=setInterval(mTick,1000);
  mPromptInt=setInterval(function(){
    mPromptIdx=(mPromptIdx+1)%PROMPTS.length;
    showPrompt(PROMPTS[mPromptIdx]);
  },20000);
}
function stopMed(){
  medRunning=false;clearInterval(mInt);clearInterval(mPromptInt);
  if(musicOn)playBell(.15);
  stopBells();
  saved('meditation','guided');
  document.getElementById('m-icon').innerHTML='<path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/>';
  showPrompt('Session complete. Well done. 🙏');
  document.getElementById('m-label').textContent='Done';
  document.getElementById('m-count').textContent='';
  document.getElementById('m-cycle').textContent='';
}
function mTick(){
  mElapsed++;
  document.getElementById('m-timer').textContent=fmtTime(mElapsed);
  var rem=mTarget-mElapsed;
  document.getElementById('m-count').textContent=rem>0?fmtTime(rem):'';
  if(mElapsed>=mTarget)stopMed();
}
function showPrompt(text){
  var el=document.getElementById('m-prompt');
  el.style.opacity=0;
  setTimeout(function(){el.textContent=text;el.style.opacity=1;},300);
}

/* ── Shared ── */
function saved(type,mode){
  stored.sessions=(stored.sessions||0)+1;
  localStorage.setItem('se_breath',JSON.stringify(stored));
  updateBadge();
  saveSessionToDB(type,mode,type==='breathing'?bElapsed:mElapsed);
}
function fmtTime(s){var m=Math.floor(s/60),sec=s%60;return m+':'+(sec<10?'0':'')+sec;}

/* Init */
document.getElementById('b-desc').textContent=MODES.box.desc;
document.getElementById('med-section').style.display='none';

})();
</script>
